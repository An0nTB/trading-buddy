name: Release-Build

# Baut Henry für Testerinnen und Tester (Doc 51): App als DMG und ZIP, Connector als .mcpb.
# Start von Hand: Actions › Release-Build › Run workflow, oder `gh workflow run release.yml`.
# Ein Tag `v<Version>` (etwa `git tag v0.9.0 && git push origin v0.9.0`) baut dieselbe Version und legt einen
# Entwurf unter Releases an; veröffentlichen tut Tim von Hand. Erst danach sieht Henry die Version (Update-Hinweis,
# App/Sources/Aktualisierung/), weil die GitHub-API Entwürfe nicht als neueste Version ausliefert.
# Im Pull Request läuft er nur, wenn sich dieser Workflow oder scripts/app_verpacken.sh ändern;
# er ist kein Pflicht-Check.
#
# Signierung und Notarisierung laufen nur bei Start von Hand oder per Tag und nur, wenn die Secrets
# gesetzt sind (Settings › Secrets and variables › Actions). Ohne sie und in jedem Pull Request baut
# der Lauf ad-hoc signiert und sagt das im Log und in der Zusammenfassung.
#   MACOS_DEVID_P12_BASE64     Zertifikat „Developer ID Application“ samt Schlüssel, .p12 in Base64
#   MACOS_DEVID_P12_PASSWORT   Passwort der .p12
#   NOTAR_API_SCHLUESSEL_BASE64  App-Store-Connect-API-Schlüssel (.p8) in Base64
#   NOTAR_API_SCHLUESSEL_ID      Schlüssel-ID
#   NOTAR_API_AUSSTELLER_ID      Issuer-ID
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer der App (leer: aus project.yml)"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/app_verpacken.sh

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verpacken:
    name: Release-Build (macOS)
    runs-on: xcode-27
    timeout-minutes: 55
    outputs:
      signierung: ${{ steps.signatur.outputs.art }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen

      # Eigener, temporärer Schlüsselbund; er wird am Ende gelöscht.
      # Die Secrets bekommt nur dieser Schritt und nur bei Start von Hand oder per Tag; ein Pull Request
      # baut immer ad-hoc, damit Code aus einem Branch nie an Zertifikat oder Notar-Schlüssel kommt.
      - name: Signierung vorbereiten
        id: signatur
        env:
          P12: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVID_P12_BASE64 || '' }}
          P12_PASSWORT: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVID_P12_PASSWORT || '' }}
          NOTAR_SCHLUESSEL: ${{ github.event_name != 'pull_request' && secrets.NOTAR_API_SCHLUESSEL_BASE64 || '' }}
          NOTAR_ID: ${{ github.event_name != 'pull_request' && secrets.NOTAR_API_SCHLUESSEL_ID || '' }}
          NOTAR_AUSSTELLER: ${{ github.event_name != 'pull_request' && secrets.NOTAR_API_AUSSTELLER_ID || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Pull Request: Signier-Secrets bleiben außen vor, der Lauf baut ad-hoc."
            echo "art=ad-hoc (Pull Request)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$P12" ] || [ -z "$P12_PASSWORT" ]; then
            echo "::warning::Keine Developer-ID-Secrets gesetzt: Die App wird ad-hoc signiert und nicht notarisiert. Tester müssen sie einmal in den Systemeinstellungen freigeben (Doc 51)."
            echo "art=ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/henry.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORT" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')"
          if [ -z "$ID" ]; then echo "::error::In MACOS_DEVID_P12_BASE64 steckt keine Identität „Developer ID Application“."; exit 1; fi
          echo "HENRY_SIGNIERUNG=$ID" >> "$GITHUB_ENV"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTAR_SCHLUESSEL" ] && [ -n "$NOTAR_ID" ] && [ -n "$NOTAR_AUSSTELLER" ]; then
            echo "$NOTAR_SCHLUESSEL" | base64 --decode > "$RUNNER_TEMP/notar.p8"
            xcrun notarytool store-credentials henry-notar --key "$RUNNER_TEMP/notar.p8" --key-id "$NOTAR_ID" --issuer "$NOTAR_AUSSTELLER" --keychain "$KC"
            rm "$RUNNER_TEMP/notar.p8"
            echo "HENRY_NOTAR_PROFIL=henry-notar" >> "$GITHUB_ENV"
            echo "HENRY_NOTAR_KEYCHAIN=$KC" >> "$GITHUB_ENV"
            echo "art=Developer ID, notarisiert" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Developer ID gesetzt, aber keine Notar-Secrets: signiert, nicht notarisiert. Gatekeeper lässt die App so nicht ohne Freigabe starten."
            echo "art=Developer ID, nicht notarisiert" >> "$GITHUB_OUTPUT"
          fi

      # Bei einem Tag kommt die Version aus dem Tag, sonst aus dem Feld „version“ oder aus project.yml.
      - name: Version bestimmen
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          VERSION="$EINGABE"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version „${VERSION}“ ist keine Nummer wie 0.9.0; Henry vergleicht nur Zahlen."
            exit 1
          fi
          echo "HENRY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: ${VERSION:-aus project.yml}"

      - name: App und Connector verpacken
        env:
          HENRY_BUILDNUMMER: ${{ github.run_number }}
        run: scripts/app_verpacken.sh

      # Wie die Startprobe in ci.yml, aber mit der signierten Release-App samt Sandbox.
      - name: Startprobe der verpackten App
        run: |
          APP=build/verteilung/Henry.app
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$BIN" > "$RUNNER_TEMP/start.log" 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            CODE=0
            wait "$PID" || CODE=$?
            echo "Die verpackte App hat sich nach weniger als 8 s beendet (Code $CODE)"
            cat "$RUNNER_TEMP/start.log"
            exit 1
          fi
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          echo "Startprobe: läuft nach 8 s"

      - name: Zusammenfassung
        run: |
          {
            echo "### Henry für Tester"
            echo ""
            echo "Signierung: ${{ steps.signatur.outputs.art }}"
            echo ""
            echo '```'
            cat build/verteilung/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: henry-verteilung-${{ github.run_number }}
          path: |
            build/verteilung/Henry-*.dmg
            build/verteilung/Henry-*.zip
            build/verteilung/Henry-Connector-*.mcpb
            build/verteilung/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Schlüsselbund löschen
        if: always() && steps.signatur.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signatur.outputs.keychain }}"

  # Nur bei einem Tag `v*`: Entwurf unter Releases mit denselben Dateien. Läuft auf Linux, braucht als einziger
  # Job Schreibrecht.
  entwurf:
    name: Release-Entwurf
    needs: verpacken
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: henry-verteilung-${{ github.run_number }}
          path: verteilung
      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Henry $VERSION für Testerinnen und Tester."
            echo ""
            echo "- Henry-$VERSION.dmg: die App zum Hineinziehen in Programme"
            echo "- Henry-$VERSION.zip: dieselbe App als ZIP"
            echo "- Henry-Connector-*.mcpb: die Erweiterung für Claude Desktop"
            echo "- SHA256SUMS.txt: Prüfsummen"
            echo ""
            echo "Signierung: ${{ needs.verpacken.outputs.signierung }}"
          } > notizen.md
          gh release create "$GITHUB_REF_NAME" verteilung/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Henry $VERSION" --notes-file notizen.md
          echo "Entwurf angelegt: Releases › Henry $VERSION. Veröffentlichen von Hand."
