name: TradingNews

# Börsennachrichten mit Merkliste: nur Linux, ohne echtes Netz (Tests mit aufgezeichneten Antworten).
# Läuft bei jedem PR ohne Pfadfilter, damit der Job Pflicht-Check auf main werden kann.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  trading-news-linux:
    name: TradingNews (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        working-directory: Packages/TradingNews
        run: swift build
      - name: Tests
        working-directory: Packages/TradingNews
        run: swift test
