name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trading-core-macos:
    name: TradingCore (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  trading-core-linux:
    name: TradingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  app:
    name: App (macOS und iOS-Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: Bauen für macOS
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Bauen für iOS-Simulator
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
