name: CI

on:
  pull_request:
  push:
    branches: [main]

# Ein neuer Push auf denselben PR bricht den laufenden Lauf ab; auf main läuft jeder Merge zu Ende.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Mac-Läufe sind knapp (Stau 02.10.2026, Tim Frage 9 = 1). Im PR laufen die Mac-Jobs für Kern,
  # Speicher, Connector und App-Tests nur, wenn sich ihr Code ändert; auf main läuft immer alles.
  # Übersprungene Jobs zählen für den Branch-Schutz als bestanden. Fällt dieser Job aus, ist jede
  # Ausgabe leer und alle Mac-Jobs laufen (Bedingung `!= 'false'`).
  aenderungen:
    name: Geänderte Bereiche
    runs-on: ubuntu-latest
    outputs:
      kern: ${{ steps.bereiche.outputs.kern }}
      speicher: ${{ steps.bereiche.outputs.speicher }}
      connector: ${{ steps.bereiche.outputs.connector }}
      apptests: ${{ steps.bereiche.outputs.apptests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: bereiche
        run: |
          alles() { for b in kern speicher connector apptests; do echo "$b=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [ "${{ github.event_name }}" = "pull_request" ] || alles
          # Im PR ist HEAD der Merge-Commit; HEAD^1 ist der Stand von main.
          DATEIEN="$(git diff --name-only HEAD^1 HEAD)" || alles
          echo "$DATEIEN"
          grep -q '^\.github/workflows/ci\.yml$' <<< "$DATEIEN" && alles
          treffer() { grep -qE "$1" <<< "$DATEIEN" && echo true || echo false; }
          echo "kern=$(treffer '^Packages/TradingCore/')" >> "$GITHUB_OUTPUT"
          echo "speicher=$(treffer '^Packages/(TradingCore|TradingStore)/')" >> "$GITHUB_OUTPUT"
          echo "connector=$(treffer '^(Packages/(TradingCore|TradingConnector)/|Connector/)')" >> "$GITHUB_OUTPUT"
          echo "apptests=$(treffer '^(App/|Packages/|project\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  trading-core-macos:
    name: TradingCore (macOS)
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.kern != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  trading-core-linux:
    name: TradingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  trading-store-macos:
    name: TradingStore (macOS)
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.speicher != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: Packages/TradingStore
        run: swift test

  trading-store-linux:
    name: TradingStore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: SQLite-Header installieren
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Tests
        working-directory: Packages/TradingStore
        run: swift test

  design-token:
    name: Design-Token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Token der App gegen Design/tokens.json prüfen
        run: python3 scripts/token_pruefen.py

  app:
    name: App (macOS und iOS-Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: Bauen für macOS
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # Bauen allein findet keine Abstürze beim Start (#63). Drei Starts mit leerem Zuhause,
      # je acht Sekunden; beendet sich die App vorher, ist der Job rot und das Protokoll steht im Log.
      - name: Startprobe macOS (drei Starts)
        run: |
          APP="$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "Starte $BIN"
          for i in 1 2 3; do
            HEIM="$RUNNER_TEMP/heim$i"
            mkdir -p "$HEIM"
            CFFIXED_USER_HOME="$HEIM" "$BIN" > "$RUNNER_TEMP/start$i.log" 2>&1 &
            PID=$!
            sleep 8
            if ! kill -0 "$PID" 2>/dev/null; then
              CODE=0
              wait "$PID" || CODE=$?
              echo "Start $i: App hat sich nach weniger als 8 s beendet (Code $CODE)"
              cat "$RUNNER_TEMP/start$i.log"
              exit 1
            fi
            kill "$PID"
            wait "$PID" 2>/dev/null || true
            echo "Start $i: läuft nach 8 s"
          done
      - name: Bauen für iOS-Simulator
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # Tests der App-Schicht (App/Tests). Eigener Job, damit Tim über die Pflicht entscheiden kann.
  app-tests:
    name: App-Tests (macOS)
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.apptests != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: Tests
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddyTests -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO test

  connector:
    name: Connector (macOS)
    needs: aenderungen
    if: ${{ !cancelled() && needs.aenderungen.outputs.connector != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/TradingConnector
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Bauen (Release)
        run: swift build -c release
      - name: Manifest prüfen
        run: |
          python3 -m json.tool ../../Connector/manifest.json > /dev/null
          VERSION=$(python3 -c 'import json; print(json.load(open("../../Connector/manifest.json"))["version"])')
          grep -q "connectorVersion = \"$VERSION\"" Sources/ConnectorKern/Verbindungsstatus.swift \
            || { echo "manifest.json $VERSION passt nicht zu Verbindungsstatus.connectorVersion"; exit 1; }
      - name: Universal bauen wie scripts/connector_bauen.sh
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/trading-buddy-mcp"
          echo "$BIN"
          lipo -archs "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            sleep 2
          ) | perl -e 'alarm 10; exec @ARGV' "$BIN" > universal.txt || true
          cat universal.txt
          grep -q '"serverInfo"' universal.txt
      - name: Server wertet die GBE-Testdateien aus
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          ORDNER="$RUNNER_TEMP/export"
          mkdir -p "$ORDNER"
          "$BIN/tb-export" --ziel "$ORDNER" --trades-je-tag 3 --beispielkurse de40.c ../TradingCore/Tests/TradingCoreTests/Fixtures/MT4/*.html
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":3,"method":"prompts/list"}'
            echo '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"hole_datenstand","arguments":{}}}'
            echo '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"hole_auswertung","arguments":{"monat":"2025-05"}}}'
            echo '{"jsonrpc":"2.0","id":6,"method":"prompts/get","params":{"name":"monatsauswertung","arguments":{"monat":"2025-05"}}}'
            echo '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"hole_trades","arguments":{"monat":"2025-05","anzahl":1e100}}}'
            echo '{"jsonrpc":"2.0","id":8,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"hole_notizen","arguments":{"monat":"2025-05"}}}'
            echo '{"jsonrpc":"2.0","id":10,"method":"tools/call","params":{"name":"hole_nachrichten","arguments":{"tage":3}}}'
            echo '{"jsonrpc":"2.0","id":12,"method":"tools/call","params":{"name":"hole_kursanalyse","arguments":{"symbol":"DE40.c","monate":12}}}'
            echo '{"jsonrpc":"2.0","id":11,"method":"tools/call","params":{"name":"hole_auswertung","arguments":{"monat":"2025-05","waehrung":"chf"}}}'
            echo '{"jsonrpc":"2.0","id":13,"method":"tools/call","params":{"name":"henry_status","arguments":{}}}'
            sleep 3
          ) | TB_EXPORT_DIR="$ORDNER" perl -e 'alarm 20; exec @ARGV' "$BIN/trading-buddy-mcp" > antwort.txt || true
          cat antwort.txt
          echo "Umfang je Antwort (Zeichen, grob 3 bis 4 je Token):"
          awk '{ print length($0) "  " substr($0, 1, 30) }' antwort.txt
          grep -q hole_aufschluesselung antwort.txt
          grep -q "VERBINDUNG STEHT" antwort.txt
          grep -q "Gespeichert insgesamt (alle Zeiträume): 104 Trades" antwort.txt
          grep -q wochenauswertung antwort.txt
          grep -q "104 Trades" antwort.txt
          grep -q "83 (54" antwort.txt
          grep -q "hole_auswertung mit monat=2025-05" antwort.txt
          grep -q "Henry · Trades" antwort.txt
          grep -q '"id":8' antwort.txt
          grep -q "Henry · Notizen" antwort.txt
          grep -q "## Eigene Handelsregeln" antwort.txt
          grep -q "Handelsregeln eingetragen" antwort.txt
          grep -q "In der App sind die Nachrichten aus" antwort.txt
          grep -q "Henry · Kursanalyse de40.c (12 Monate)" antwort.txt
          grep -q "Eigene Trades in diesem Wert (geschlossen seit" antwort.txt
          grep -q "Kursverläufe (Tageskerzen) für 1 Werte: de40.c" antwort.txt
          grep -q "kommt in diesem Konto nicht vor. Vorhanden: EUR" antwort.txt
      - name: Server meldet fehlenden Export-Ordner
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"hole_datenstand","arguments":{}}}'
            sleep 3
          ) | perl -e 'alarm 20; exec @ARGV' "$BIN/trading-buddy-mcp" > antwort2.txt || true
          cat antwort2.txt
          grep -q "KEIN ORDNER" antwort2.txt
