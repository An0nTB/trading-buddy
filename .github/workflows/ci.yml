name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trading-core-macos:
    name: TradingCore (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  trading-core-linux:
    name: TradingCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        working-directory: Packages/TradingCore
        run: swift test

  trading-store-macos:
    name: TradingStore (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: Packages/TradingStore
        run: swift test

  trading-store-linux:
    name: TradingStore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: SQLite-Header installieren
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Tests
        working-directory: Packages/TradingStore
        run: swift test

  design-token:
    name: Design-Token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Token der App gegen Design/tokens.json prüfen
        run: python3 scripts/token_pruefen.py

  app:
    name: App (macOS und iOS-Simulator)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: xcodegen generate
      - name: Bauen für macOS
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Bauen für iOS-Simulator
        run: xcodebuild -project TradingBuddy.xcodeproj -scheme TradingBuddy -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  connector:
    name: Connector (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/TradingConnector
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Bauen (Release)
        run: swift build -c release
      - name: Manifest prüfen
        run: python3 -m json.tool ../../Connector/manifest.json > /dev/null
      - name: Server antwortet auf MCP-Anfragen
        run: |
          BIN="$(swift build -c release --show-bin-path)/trading-buddy-mcp"
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hole_kennzahlen","arguments":{}}}'
            sleep 3
          ) | perl -e 'alarm 20; exec @ARGV' "$BIN" > antwort.txt || true
          cat antwort.txt
          grep -q pruefe_datenweg antwort.txt
          grep -q Profitfaktor antwort.txt
      - name: Server liest den Export-Ordner
        run: |
          BIN="$(swift build -c release --show-bin-path)/trading-buddy-mcp"
          ORDNER="$RUNNER_TEMP/export"
          mkdir -p "$ORDNER"
          echo '{"wert":42}' > "$ORDNER/connector-test.json"
          (
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"pruefe_datenweg","arguments":{}}}'
            sleep 3
          ) | TB_EXPORT_DIR="$ORDNER" perl -e 'alarm 20; exec @ARGV' "$BIN" > antwort2.txt || true
          cat antwort2.txt
          grep -q ERFOLG antwort2.txt
