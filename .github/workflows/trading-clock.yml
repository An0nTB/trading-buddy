name: TradingClock

# Börsenuhr: nur Linux, weil das Paket nichts Apple-Eigenes nutzt und macOS-Minuten knapp sind.
# Läuft nur, wenn sich das Paket oder diese Datei ändert.
on:
  pull_request:
    paths:
      - "Packages/TradingClock/**"
      - ".github/workflows/trading-clock.yml"
  push:
    branches: [main, "claude/boersenuhr-*"]
    paths:
      - "Packages/TradingClock/**"
      - ".github/workflows/trading-clock.yml"

jobs:
  trading-clock-linux:
    name: TradingClock (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        working-directory: Packages/TradingClock
        run: swift build
      - name: Tests
        working-directory: Packages/TradingClock
        run: swift test
