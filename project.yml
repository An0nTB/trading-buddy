# Bauplan für das Xcode-Projekt. Daraus erzeugt XcodeGen die Datei
# TradingBuddy.xcodeproj (wird nicht eingecheckt): `xcodegen generate`
name: TradingBuddy
options:
  bundleIdPrefix: de.timbock
  developmentLanguage: de
  # Verhindert den Xcode-Dialog „Update to recommended settings“
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  TradingCore:
    path: Packages/TradingCore
  TradingStore:
    path: Packages/TradingStore
  TradingClock:
    path: Packages/TradingClock
  TradingQuotes:
    path: Packages/TradingQuotes
  TradingCalendar:
    path: Packages/TradingCalendar
  TradingNews:
    path: Packages/TradingNews
  TradingAssistant:
    path: Packages/TradingAssistant
  TradingRates:
    path: Packages/TradingRates
targets:
  TradingBuddy:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Sources
      # Ausdrücklich Ressourcen, damit die Lernkapitel (App/Resources/Lernen/*.md) sicher ins Bundle kommen
      # (Dritter Gegencheck G10, Doc 41).
      - path: App/Resources
        buildPhase: resources
      # Versionsstand des Connectors aus demselben Commit, für Hilfe › „Problem melden“ (Nachtpaket AP11).
      - path: Connector/manifest.json
        buildPhase: resources
    dependencies:
      - package: TradingCore
      - package: TradingStore
      - package: TradingClock
      - package: TradingQuotes
      - package: TradingCalendar
      - package: TradingNews
      - package: TradingAssistant
      - package: TradingRates
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timbock.journal
        PRODUCT_NAME: Trading Buddy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Sichtbarer Name „Henry“ (Tim 02.10.2026, vorher Brad): Xcode mischt App/Info.plist (CFBundleName, CFBundleDisplayName)
        # in die erzeugte Info.plist; PRODUCT_NAME, Bundle-ID und Pfade bleiben „Trading Buddy“.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad: weitere Fenster erlauben (P12 Eigene Fenster, Doc 27)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TradingBuddy-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
    scheme: {}
  # Tests der App-Schicht (App/Tests, Swift Testing). Läuft in der App als Wirt, damit `@testable import`
  # die internen Typen sieht; nur macOS. Eigener CI-Job „App-Tests (macOS)“, Schema TradingBuddyTests.
  TradingBuddyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: TradingBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timbock.journal.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trading Buddy.app/Contents/MacOS/Trading Buddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TradingBuddyTests:
    build:
      targets:
        TradingBuddy: all
        TradingBuddyTests: [test]
    test:
      config: Debug
      targets:
        - TradingBuddyTests
